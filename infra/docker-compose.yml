version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: disaster_ai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: disaster_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: always

  redis:
    image: redis:7-alpine
    container_name: disaster_ai_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ../backend
    container_name: disaster_ai_backend
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: disaster_ai
      REDIS_HOST: redis
      SECRET_KEY: disaster-ai-secret-hackathon-2026
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  admin:
    build:
      context: ../admin
    container_name: disaster_ai_admin
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
